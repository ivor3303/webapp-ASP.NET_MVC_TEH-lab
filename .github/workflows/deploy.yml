name: Build and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore lab-1/Vjezba.App/Vjezba.App.csproj

      - name: Build
        run: dotnet build lab-1/Vjezba.App/Vjezba.App.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish lab-1/Vjezba.App/Vjezba.App.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vjezba-app
          path: ./publish
