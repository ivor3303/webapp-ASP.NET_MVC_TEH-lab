name: Deploy Vjezba App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore lab-1/Vjezba.App/Vjezba.App.csproj

      - name: Build
        run: dotnet build lab-1/Vjezba.App/Vjezba.App.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish lab-1/Vjezba.App/Vjezba.App.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: vjezba-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
